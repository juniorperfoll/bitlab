name = "bitlab-api"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Preencher database_id após `wrangler d1 create bitlab-db` (ver quickstart.md).
[[d1_databases]]
binding = "DB"
database_name = "bitlab-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"
